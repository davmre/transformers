[tool.isort]
profile = "google"
known_jax = ["numpy","jax"]
known_jax_ecosystem = ["brax","flax","orbax","optax","tensorflow_probability"]
sections=["FUTURE","STDLIB","THIRDPARTY","JAX","JAX_ECOSYSTEM","FIRSTPARTY","LOCALFOLDER"]

[tool.yapf]
style = "google"

[tool.pyright]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["daves_transformer_lib"]
exclude = [".venv", ".gradient", "**/*_test.py", "experiments"]
ignore = ["notebooks", "**/*.ipynb"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [".venv", ".gradient", "experiments", "*_test.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F722", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["daves_transformer_lib"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["F401", "F841"]
